name: Update calendar feed

# Rebuilds calendar.ics (the feed for Subscribe to Calendar) whenever staff press
# Save Changes, and once a day so the feed's date range keeps moving forward.
on:
  push:
    branches: [main]
    paths:
      - data/site.json
      - .github/scripts/calendar_feed.py
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build calendar.ics
        run: python .github/scripts/calendar_feed.py data/site.json calendar.ics
      - name: Publish if anything changed
        run: |
          if [ -n "$(git status --porcelain calendar.ics)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add calendar.ics
            git commit -m "Update calendar feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
