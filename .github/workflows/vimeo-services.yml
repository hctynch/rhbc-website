name: Update earlier services from Vimeo

on:
  schedule:
    # Sundays every 30 minutes from about noon to 5 PM Eastern, plus once a day
    - cron: "*/30 16-22 * * 0"
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vimeo-services
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read recordings from Vimeo
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: python .github/scripts/vimeo_services.py
      - name: Publish if anything changed
        run: |
          if [ -n "$(git status --porcelain data/services.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/services.json
            git commit -m "Update earlier services from Vimeo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
