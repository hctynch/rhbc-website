name: Import past bulletins

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-bulletins
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bulletins and add them to the site
        run: python .github/scripts/import_bulletins.py
      - name: Publish
        run: |
          if [ -n "$(git status --porcelain bulletins data/site.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add bulletins data/site.json
            git commit -m "Import past bulletins from the old website"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
